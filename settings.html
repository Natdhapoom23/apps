<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <title>การตั้งค่า · Apps</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
  <script type="module" src="settings.js"></script>
</head>
<body class="settings-page">
  <aside class="sidebar"><a class="logo" href="./" aria-label="Apps หน้าแรก">a<span>.</span></a><a class="home" href="./" aria-label="แอปทั้งหมด"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/></svg></a></aside>
  <div class="workspace">
    <header class="topbar"><a class="mobile-logo" href="./">apps<span>.</span></a><a class="back-link" href="./">← แอปทั้งหมด</a><span class="wordmark">apps<span>.</span></span></header>
    <main class="settings-main">
      <div id="notice" class="settings-notice" role="status" aria-live="polite" hidden></div>
      <section id="login-panel" class="settings-card">
        <p class="settings-kicker">ผู้สอน</p>
        <h1>การตั้งค่า</h1>
        <p>จัดการรหัสผ่านแอดมินที่ใช้ร่วมกันกับทุกเกมและกิจกรรม</p>
        <form id="login-form">
          <label>รหัสผ่านแอดมิน<input id="password" type="password" required autocomplete="current-password"></label>
          <button class="settings-primary" type="submit">เข้าสู่ระบบ</button>
        </form>
      </section>
      <section id="settings-panel" class="settings-card" hidden>
        <div class="settings-heading"><div><p class="settings-kicker">การเข้าถึงระบบ</p><h1>รหัสผ่านแอดมิน</h1><p>รหัสนี้ใช้เข้าสู่หน้าจัดการของ AI จริงหรือหลอก, เปิดแผ่นป้าย, วงล้อเสี่ยงโชค และเกมเศรษฐี</p></div><button id="logout" class="settings-secondary" type="button">ออกจากระบบ</button></div>
        <form id="password-form" class="settings-form">
          <label>รหัสผ่านเดิม<input id="current-password" type="password" required autocomplete="current-password"></label>
          <label>รหัสผ่านใหม่<input id="new-password" type="password" minlength="8" required autocomplete="new-password"></label>
          <label>ยืนยันรหัสผ่านใหม่<input id="confirm-password" type="password" minlength="8" required autocomplete="new-password"></label>
          <button class="settings-primary" type="submit">บันทึกรหัสผ่านใหม่</button>
        </form>
      </section>
    </main>
  </div>
</body>
</html>
