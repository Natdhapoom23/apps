<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>จอฉาย · Workshop Live</title><link rel="icon" href="/assets/favicon.svg"><link rel="stylesheet" href="game.css"><script type="module" src="display.js"></script></head><body class="display-body"><header class="top"><span class="brand">WORKSHOP<span> LIVE</span></span><span id="display-title"></span><div class="actions"><span id="connection" class="small muted">กำลังเชื่อมต่อ</span><button id="fullscreen" class="subtle">เต็มจอ ⛶</button></div></header><main class="display-shell"><div id="notice" class="notice" role="status" hidden></div><div class="display-layout"><section class="stage"><div class="stage-top"><span id="round-label" class="eyebrow">พร้อมแล้วมาเข้าห้องกัน</span><span id="display-timer" class="countdown">—</span></div><div id="lobby"><h1>หยิบมือถือ<br>แล้วมาเล่นด้วยกัน<span class="lime-text">.</span></h1><div class="join-block"><img id="qr" alt="QR Code สำหรับเข้าร่วมห้อง" width="210" height="210"><div><p class="muted">สแกน QR หรือกรอกรหัสห้อง</p><strong id="display-code" class="room-code"></strong><p><a id="join-link" target="_blank" rel="noopener">เปิดหน้าผู้เล่น ↗</a></p><p id="joined" class="lime-text"></p></div></div></div><div id="question-stage" hidden><h1 id="question-title"></h1><img id="question-image" alt="ภาพประกอบคำถาม" hidden><a id="image-source" class="small muted" target="_blank" rel="noopener" hidden>แหล่งที่มาของภาพ ↗</a><div id="display-options" class="display-options"></div><div class="progress-track"><div id="answer-progress"></div></div><p id="answer-count" class="muted"></p><div id="explanation" class="explanation" hidden></div><p id="fastest" class="small lime-text"></p></div><div id="finished" hidden><p class="eyebrow">จบกิจกรรม</p><h1>ขอบคุณที่<br>เรียนรู้ไปด้วยกัน<span class="lime-text">.</span></h1><p class="muted">คะแนนรวมอยู่ทางด้านขวา</p></div></section><aside class="scoreboards"><section clas
