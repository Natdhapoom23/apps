<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ผู้เล่น · Workshop Live</title><link rel="icon" href="/assets/favicon.svg"><link rel="stylesheet" href="game.css"><script type="module" src="play.js"></script></head><body class="player-body"><header class="top"><a href="./">← กลับ</a><span class="brand">WORKSHOP<span> LIVE</span></span></header><main class="player-shell"><div id="notice" class="notice" role="status" hidden></div><p class="muted small"><span id="connection">กำลังเชื่อมต่อ</span> · ห้อง <strong id="room-code"></strong></p>
<section id="join-panel" class="panel"><p class="eyebrow">เข้าร่วมกิจกรรม</p><h1 id="join-title">มาเล่นด้วยกัน</h1><form id="join-form"><label>ชื่อที่ใช้แสดงบนจอ<input id="player-name" maxlength="40" required autocomplete="nickname" placeholder="ชื่อเล่นของคุณ"></label><label>กลุ่มของคุณ<select id="player-group" required></select></label><p class="muted small">ชื่อ กลุ่ม และคะแนนจะแสดงบนจอของห้องอบรม</p><button class="primary" id="join-button">พร้อมแล้ว เข้าห้องเลย ↗</button></form></section>
<section id="player-panel" hidden><div class="player-id"><div><strong id="your-name"></strong><span id="your-group" class="muted small"></span></div><div><strong id="your-score">0</strong><span class="muted small">คะแนน</span></div></div><section id="waiting" class="panel wait-panel"><div class="waiting-symbol">✳</div><h1 id="waiting-title">เข้าห้องแล้ว!</h1><p id="waiting-text" class="muted">ดูคำถามบนจอหลัก แล้วรอผู้สอนเริ่มกิจกรรม</p></section><section id="answer-panel" hidden><div class="answer-top"><div><p class="eyebrow" id="round-number"></p><h1>เลือกคำตอบของคุณ</h1></div><div id="player-timer" class="countdown">30</div></div><p class="muted">ดูคำถามบนจอหลัก · เปลี่ยนคำตอบได้ก่อนหมดเวลา</p><div id="options" class="answer-options"></div><p id="answer-status" class="answer-status" role="status" aria-live="polite"></p></section><section id="result-panel" class="panel" hidden><p class="eyebrow">ผลรอบนี้</p><h2 id="result-title"></h2><p id="result-detail" class="muted"></p></section></section></main></body></html>
