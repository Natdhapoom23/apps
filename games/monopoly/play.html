<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>เกมเศรษฐี</title><link rel="stylesheet" href="monopoly.css"><style>.board{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;max-width:760px;margin:20px auto}.space{min-height:100px;border-radius:14px;background:#fff;border:1px solid #d7dce7;padding:10px}.space.active{outline:4px solid #ffb547}.space small{display:block;color:#667085}.dice{font-size:80px;text-align:center}.players{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}.player{padding:8px 12px;background:#e5ecff;border-radius:20px}.center{text-align:center}</style></head><body><main class=center><h1 id=title>เกมเศรษฐี</h1><div id=join><input id=name placeholder="ชื่อผู้เล่น"><button id=join-btn>เข้าร่วม</button></div><div id=game hidden><div class=dice id=dice>🎲</div><button id=roll>ทอยลูกเต๋า</button><div id=message class=result></div><div id=players class=players></div><div id=board class=board></div></div></main><script type=module src=monopoly-play.js></script></body></html>
