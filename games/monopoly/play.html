<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>เกมเศรษฐี</title><link rel="stylesheet" href="monopoly.css"><link rel="stylesheet" href="play.css"></head><body><main><a href="/">← รวมกิจกรรม</a><h1 id="title">เกมเศรษฐี</h1><form id="join"><label>ชื่อผู้เล่น / ชื่อทีม<input id="name" maxlength="40" required autocomplete="nickname"></label><button id="join-btn">เข้าร่วมกระดาน</button></form><section id="game" hidden><div id="players" class="players"></div><div class="board-shell"><div id="board" class="board"></div><div class="board-center"><p class="eyebrow">ROLL · WALK · DISCOVER</p><h2>เดินทางไปด้วยกัน</h2><p id="turn-label"></p><button id="roll" aria-label="ทอยลูกเต๋า"><span id="dice" class="cube"><span class="die-face face-1" data-value="1"><i class="pip p5"></i></span><span class="die-face face-2" data-value="2"><i class="pip p1"></i><i class="pip p9"></i></span><span class="die-face face-3" data-value="3"><i class="pip p1"></i><i class="pip p5"></i><i class="pip p9"></i></span><span class="die-face face-4" data-value="4"><i class="pip p1"></i><i class="pip p3"></i><i class="pip p7"></i><i class="pip p9"></i></span><span class="die-face face-5" data-value="5"><i class="pip p1"></i><i class="pip p3"></i><i class="pip p5"></i><i class="pip p7"></i><i class="pip p9"></i></span><span class="die-face face-6" data-value="6"><i class="pip p1"></i><i class="pip p3"></i><i class="pip p4"></i><i class="pip p6"></i><i class="pip p7"></i><i class="pip p9"></i></span></span></button><p id="message" role="status">คลิกลูกเต๋าเพื่อเริ่มเดิน</p></div></div></section><dialog id="landing"><p class="eyebrow" id="landing-number"></p><h2 id="landing-title"></h2><p id="landing-text"></p><p id="landing-effect"></p><button id="continue">ไปต่อ</button></dialog></main><script type="module" src="monopoly-play.js"></script></body></html>
