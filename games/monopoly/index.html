<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>เกมเศรษฐี</title><link rel="stylesheet" href="monopoly.css"><link rel="stylesheet" href="admin.css?v=cms-2"></head><body><main><div id="notice" class="notice" hidden></div><section id="login" class="panel"><h1>เกมเศรษฐี</h1><form id="login-form"><label>รหัสผ่านผู้สอน<input id="password" type="password" required></label><button>เข้าสู่ระบบ</button></form></section><section id="app" hidden><div class="top"><h1>ห้องเกมเศรษฐี</h1><div><a class="button secondary" href="../../settings.html">การตั้งค่า</a> <button id="create">+ สร้างห้องใหม่</button></div></div><div id="rooms" class="rooms"></div><section id="editor" class="panel room-editor" hidden><div class="editor-heading"><h2 id="room-title"></h2><a id="play" class="button secondary" target="_blank">เปิดหน้าผู้เล่น ↗</a></div><label>ชื่อห้อง<input id="title"></label><details open class="cms-section"><summary>คลังคำถาม <span>เพิ่ม · แก้ไข · ลบ · เปิด/ซ่อน</span></summary><div class="cms-body"><div class="cms-heading"><p class="sub">คำถามในคลังจะถูกสุ่มขึ้นมาเล่น ไม่ผูกกับช่องบนกระดาน</p><button id="add-question" class="secondary" type="button">+ เพิ่มคำถาม</button></div><div id="questions-cms"></div></div></details><details class="cms-section"><summary>ทีม / ผู้เล่น</summary><div class="cms-body"><div id="teams"></div></div></details><details class="cms-section"><summary>ป้ายช่องบนกระดาน <span>ตกแต่งชื่อและข้อความที่แสดงบนกระดาน</span></summary><div class="cms-body"><p class="sub">ส่วนนี้เปลี่ยนเฉพาะชื่อป้ายแต่ละช่อง คำถามยังสุ่มจากคลังด้านบน</p><label>จำนวนช่องกระดาน<input id="board-length" type="number" min="10" max="60" value="30"></label><div id="spaces" class="edit-grid"></div></div></details><div class="editor-actions"><button id="save">บันทึกการตั้งค่า</button><button id="reset" class="secondary">เริ่มกระดานใหม่ทั้งหมด</button></div></section></section></main><script type="module"
