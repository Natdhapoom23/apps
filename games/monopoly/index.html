<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>เกมเศรษฐี</title><link rel="stylesheet" href="monopoly.css"><link rel="stylesheet" href="admin.css?v=cms-1"></head><body><main><div id="notice" class="notice" hidden></div><section id="login" class="panel"><h1>เกมเศรษฐี</h1><form id="login-form"><label>รหัสผ่านผู้สอน<input id="password" type="password" required></label><button>เข้าสู่ระบบ</button></form></section><section id="app" hidden><div class="top"><h1>ห้องเกมเศรษฐี</h1><div><a class="button secondary" href="../../settings.html">การตั้งค่า</a> <button id="create">+ สร้างห้องใหม่</button></div></div><div id="rooms" class="rooms"></div><section id="editor" class="panel" hidden><h2 id="room-title"></h2><label>ชื่อห้อง<input id="title"></label><label>จำนวนช่องกระดาน<input id="board-length" type="number" min="10" max="60" value="30"></label><section class="cms-section"><div class="cms-heading"><div><h2>คลังคำถาม</h2><p class="sub">เปิด/ซ่อนคำถาม แก้ไข ลบ และดูตัวอย่างรูปได้จากการ์ด</p></div><button id="add-question" class="secondary" type="button">+ เพิ่มคำถาม</button></div><div id="questions-cms"></div></section><section class="cms-section"><h2>ทีม / ผู้เล่น</h2><div id="teams"></div></section><div id="spaces" class="edit-grid"></div><button id="save">บันทึก</button> <button id="reset" class="secondary">เริ่มกระดานใหม่</button><p><a id="play" class="button secondary" target="_blank">เปิดหน้าผู้เล่น ↗</a></p></section></section></main><script type="module" src="monopoly-admin.js?v=cms-1"></script></body></html>
