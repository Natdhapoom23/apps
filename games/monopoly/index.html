<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>เกมเศรษฐี</title><link rel="stylesheet" href="monopoly.css"></head><body><main><div id="notice" class="notice" hidden></div><section id="login" class="panel"><h1>เกมเศรษฐี</h1><form id="login-form"><label>รหัสผ่านผู้สอน<input id="password" type="password" required></label><button>เข้าสู่ระบบ</button></form></section><section id="app" hidden><div class="top"><h1>ห้องเกมเศรษฐี</h1><button id="create">+ สร้างห้องใหม่</button></div><div id="rooms" class="rooms"></div><section id="editor" class="panel" hidden><h2 id="room-title"></h2><label>ชื่อห้อง<input id="title"></label><p class="sub">แก้ไขคำสั่งของแต่ละช่อง เช่น +2, -3 หรือคะแนน</p><div id="spaces" class="edit-grid"></div><button id="save">บันทึก</button> <button id="reset" class="secondary">เริ่มกระดานใหม่</button><p><a id="play" class="button secondary" target="_blank">เปิดหน้าผู้เล่น ↗</a></p></section></section></main><script type="module" src="monopoly-admin.js"></script></body></html>
