<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>เข้าร่วมเกมเศรษฐี</title><link rel="stylesheet" href="monopoly.css"><link rel="stylesheet" href="join.css"></head><body><main class="join-main"><a href="/">← รวมกิจกรรม</a><div id="notice" class="notice" hidden></div><p class="eyebrow">เกมเศรษฐี · ห้อง <span id="room-code"></span></p><section id="join-panel" class="join-card"><h1 id="room-title">เข้าร่วมเกม</h1><p>เลือกทีม แล้วใช้มือถือของคุณส่งคำตอบเมื่อทีมเดินถึงช่องคำถาม</p><form id="join-form"><label>ชื่อที่ใช้แสดง<input id="player-name" maxlength="40" required placeholder="เช่น คุณนัท"></label><label>ทีม<select id="team" required></select></label><button class="primary" type="submit">เข้าร่วมเกม</button></form></section><section id="player-panel" class="join-card" hidden><div class="player-head"><div><span class="muted small">คุณเข้าร่วมใน</span><h1 id="player-team"></h1></div><button id="leave" class="secondary" type="button">เปลี่ยนทีม</button></div><div id="status" class="join-status">รอทีมของคุณทอยลูกเต๋า</div><div id="question-panel" hidden><p class="eyebrow">ตอบให้เร็วเพื่อรับคะแนนสูง</p><h2 id="question"></h2><div id="options" class="mobile-options"></div><p id="timer" class="mobile-timer"></p></div></section></main><script type="module" src="join.js"></script></body></html>
