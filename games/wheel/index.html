<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>วงล้อเสี่ยงโชค</title><link rel="stylesheet" href="wheel.css"></head><body><main><div id="notice" class="notice" hidden></div><section id="login" class="panel"><h1>วงล้อเสี่ยงโชค</h1><form id="login-form"><label>รหัสผ่านผู้สอน<input id="password" type="password" required></label><button>เข้าสู่ระบบ</button></form></section><section id="app" hidden><div class="top"><h1>ห้องวงล้อ</h1><div><a class="button secondary" href="../../settings.html">การตั้งค่า</a> <button id="create">+ สร้างห้องใหม่</button></div></div><div id="rooms" class="rooms"></div><section id="editor" class="panel" hidden><h2 id="room-title"></h2><label>ชื่อห้อง<input id="title"></label><label>ตัวเลือก (หนึ่งรายการต่อบรรทัด)<textarea id="options" rows="8"></textarea></label><label>เวลาหมุน (วินาที)<input id="duration" type="number" min="1" max="60"></label><label><input id="locked" type="checkbox"> ล็อคผลลัพธ์ที่เลือก</label><label>ผลลัพธ์เมื่อล็อค<select id="locked-result"></select></label><button id="save">บันทึก</button> <button id="reset" class="secondary">เริ่มรอบใหม่</button><p><a id="play-link" class="button secondary" target="_blank">เปิดหน้าผู้เล่น ↗</a></p></section></section></main><script type="module" src="wheel-admin.js"></script></body></html>
