<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>วงล้อเสี่ยงโชค</title><link rel="stylesheet" href="wheel.css?v=admin-accordion-1"><link rel="stylesheet" href="../admin-layout.css?v=1"></head><body><main><div id="notice" class="notice" hidden></div><section id="login" class="panel"><h1>วงล้อเสี่ยงโชค</h1><form id="login-form"><label>รหัสผ่านผู้สอน<input id="password" type="password" required></label><button>เข้าสู่ระบบ</button></form></section><section id="app" hidden><div class="top"><h1>ห้องวงล้อ</h1><div class="admin-actions"><button id="settings-link" class="secondary" type="button">การตั้งค่า</button> <button id="create">+ สร้างห้องใหม่</button></div></div><div id="rooms" class="rooms"></div><section id="editor" class="panel room-editor" hidden><h2 id="room-title"></h2><label>ชื่อห้อง<input id="title"></label><details open class="admin-accordion"><summary>ตัวเลือกวงล้อ <span>หนึ่งรายการต่อบรรทัด</span></summary><div><label>ตัวเลือก<textarea id="options" rows="8"></textarea></label></div></details><details class="admin-accordion"><summary>การหมุนและผลลัพธ์ <span>เวลา · ล็อคผล</span></summary><div><label>เวลาหมุน (วินาที)<input id="duration" type="number" min="1" max="60"></label><label><input id="locked" type="checkbox"> ล็อคผลลัพธ์ที่เลือก</label><label>ผลลัพธ์เมื่อล็อค<select id="locked-result"></select></label></div></details><p id="save-status" role="status" aria-live="polite" hidden></p><button id="save">บันทึก</button> <button id="reset" class="secondary">เริ่มรอบใหม่</button><p><button id="play-link" class="secondary" type="button">เปิดหน้าผู้เล่น ↗</button></p></section></section></main><script type="module" src="wheel-admin.js"></script><script type="module" src="../room-editor-inline.js"></script></body></html>
