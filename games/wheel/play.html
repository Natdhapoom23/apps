<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>วงล้อเสี่ยงโชค</title><link rel="stylesheet" href="wheel.css"><style>.wheel-wrap{position:relative;width:min(70vw,520px);margin:30px auto}.pointer{position:absolute;z-index:2;top:-10px;left:50%;transform:translateX(-50%);width:0;height:0;border-left:22px solid transparent;border-right:22px solid transparent;border-top:42px solid #172033;filter:drop-shadow(0 3px 3px #0003)}.wheel{width:100%;aspect-ratio:1;border-radius:50%;background:conic-gradient(#536dfe 0 25%,#ffb547 0 50%,#43c59e 0 75%,#ef6f6c 0);border:14px solid white;box-shadow:0 10px 30px #0002;display:grid;place-items:center;transition:transform 3s cubic-bezier(.15,.8,.25,1)}.wheel span{font-size:70px;color:white}.center{text-align:center}.result{font-size:clamp(26px,5vw,48px);font-weight:700;min-height:1.4em}</style></head><body><main class="center"><p class="sub">กดปุ่มเพื่อหมุนวงล้อ</p><h1 id="title">กำลังเชื่อมต่อ…</h1><div class="wheel-wrap"><div class="pointer" aria-hidden="true"></div><div id="wheel" class="wheel"><span>★</span></div></div><button id="spin">หมุนวงล้อ</button><div id="result" class="result"></div></main><script type="module" src="wheel-play.js"></script></body></html>
