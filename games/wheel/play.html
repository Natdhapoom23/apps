<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>วงล้อเสี่ยงโชค</title><link rel="stylesheet" href="wheel.css"><style>.wheel-wrap{position:relative;width:min(70vw,520px);margin:30px auto}.pointer{position:absolute;z-index:2;top:50%;right:-10px;transform:translateY(-50%);width:0;height:0;border-top:22px solid transparent;border-bottom:22px solid transparent;border-right:42px solid #172033;filter:drop-shadow(0 3px 3px #0003)}.wheel{position:relative;width:100%;aspect-ratio:1;border-radius:50%;background:conic-gradient(#536dfe 0 25%,#ffb547 0 50%,#43c59e 0 75%,#ef6f6c 0);border:14px solid white;box-shadow:0 10px 30px #0002;display:grid;place-items:center;transition:transform 3s cubic-bezier(.15,.8,.25,1)}.wheel span{font-size:70px;color:white}.wheel-label{position:absolute;left:50%;top:50%;width:68%;transform-origin:center;text-align:center;font-size:16px;font-weight:700;color:white;text-shadow:0 1px 3px #0008;line-height:1.15;overflow-wrap:anywhere;word-break:break-word}.center{text-align:center}.modal{position:fixed;inset:0;z-index:10;background:#17203399;display:grid;place-items:center;padding:20px}.modal-card{position:relative;background:white;border-radius:24px;padding:42px 55px;text-align:center;min-width:min(90vw,520px);box-shadow:0 20px 70px #0004}.modal-close{position:absolute;top:10px;right:15px;background:transparent;color:#172033;font-size:30px;padding:2px 10px}.modal-result{font-size:clamp(34px,8vw,76px);font-weight:700;color:#536dfe;animation:blink .9s ease-in-out infinite alternate}@keyframes blink{from{opacity:.45;transform:scale(.98)}to{opacity:1;transform:scale(1.03)}}.result{font-size:clamp(26px,5vw,48px);font-weight:700;min-height:1.4em}</style></head><body><main class="center"><p class="sub">กดปุ่มเพื่อหมุนวงล้อ</p><h1 id="title">กำลังเชื่อมต่อ…</h1><div class="wheel-wrap"><div class="pointer" aria-hidden="true"></div><div id="wheel" class="wheel"><span>★</span></div></div><button id="spin">หมุนวงล้อ</button><div id="result" class="result"></div><div id="result-modal" class="modal" hidden><div class="modal-card"><button id="close-modal" class="modal-close" aria-label="ปิด">×</button><p class="sub">ผลการหมุนวงล้อ</p><div id="modal-result" class="modal-result"></div></div></div></main><script type="module" src="wheel-play.js"></script></body></html>
