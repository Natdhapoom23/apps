<!doctype html>
<html lang="th" class="wheel-page">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>วงล้อเสี่ยงโชค</title><link rel="stylesheet" href="wheel.css?v=viewport-2"></head>
<body class="wheel-play">
<main>
  <header class="play-header"><div><p class="sub">หมุน ลุ้น แล้วรอรับผลเมื่อวงล้อหยุด</p><h1 id="title">กำลังเชื่อมต่อ…</h1></div><button id="fullscreen" class="secondary" type="button">เต็มหน้าจอ ↗</button></header>
  <div id="notice" class="notice" role="alert" hidden></div>
  <section class="wheel-stage" aria-label="วงล้อสุ่มตัวเลือก">
    <div class="wheel-wrap"><div class="pointer" aria-hidden="true"></div><div class="wheel-clip"><div id="wheel" class="wheel"></div></div><div class="wheel-hub" aria-hidden="true">✦</div></div>
  </section>
  <footer class="play-footer"><button id="spin" type="button" disabled>หมุนวงล้อ <span aria-hidden="true">↻</span></button><p id="result" class="result" aria-live="polite">พร้อมลุ้นไปด้วยกัน</p></footer>
</main>
<dialog id="result-modal" class="modal" aria-labelledby="modal-heading" aria-describedby="modal-result">
  <div class="modal-card"><button id="close-modal" class="modal-close" aria-label="ปิดป้ายผลลัพธ์" type="button">×</button><div class="result-spark" aria-hidden="true">✦</div><p id="modal-heading" class="sub">วงล้อหยุดแล้ว! ตัวเลือกที่ได้คือ</p><div id="modal-result" class="modal-result"></div><button id="dismiss-result" type="button">ปิดป้าย</button><p class="dismiss-hint">คลิกพื้นที่ว่างหรือกด Esc เพื่อปิด</p></div>
</dialog>
<script type="module" src="wheel-play.js"></script>
</body></html>
