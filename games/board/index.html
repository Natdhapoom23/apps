<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>เปิดแผ่นป้าย</title><link rel="stylesheet" href="board.css"></head><body><main><div id="notice" class="notice" hidden></div><section id="login" class="panel"><p class="sub">ระบบแผ่นป้าย</p><h1>เข้าสู่ห้องควบคุม</h1><form id="login-form"><label>รหัสผ่านผู้สอน<input id="password" type="password" required></label><button>เข้าสู่ระบบ</button></form></section><section id="app" hidden><div class="top"><div><h1>เปิดแผ่นป้าย</h1></div><div><a class="button secondary" href="../../settings.html">การตั้งค่า</a> <button id="create">+ สร้างห้องใหม่</button></div></div><div id="rooms" class="rooms"></div><section id="editor" class="panel" hidden><div class="top"><h2 id="room-title"></h2><div><button id="reset" class="secondary">ปิดแผ่นป้ายทั้งหมด</button><button id="save">บันทึก</button></div></div><label>ชื่อห้อง<input id="title"></label><p class="sub">กำหนดข้อความหรือรูปภาพที่อยู่หลังแผ่นป้าย เพิ่มจำนวนได้ตามต้องการ</p><div id="edit-grid" class="edit-grid"></div><button id="add-tile" class="secondary">+ เพิ่มแผ่นป้าย</button><p><a id="play-link" class="button secondary" target="_blank">เปิดหน้าผู้เล่น ↗</a></p></section></section></main><script type="module" src="board-admin.js"></script></body></html>
